<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Facturas</title> <!-- Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- NUEVO: CSS de autenticación -->
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>📄 Sistema de Facturas</h1>
            <p>Inicia sesión para continuar</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/auth/login">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">
                Iniciar Sesión
            </button>
        </form>

        <div class="register-link">
            <p class="text-muted">¿No tienes cuenta? <a href="/auth/register" class="text-decoration-none">Regístrate aquí</a></p>
        </div>

        <!-- Información de usuario demo -->
        <div class="mt-4 p-3 bg-light rounded">
            <small class="text-muted">
                <strong>Usuario demo:</strong><br>
                Usuario: admin<br>
                Contraseña: admin123
            </small>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
