<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Facturas</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        .register-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .register-header p {
            color: #666;
            margin: 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .alert {
            border-radius: 10px;
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }
        .role-info {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container">
            <div class="register-header">
                <h1>📄 Sistema de Facturas</h1>
                <p>Crear nueva cuenta</p>
            </div>

            {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i> {{ success }}
            </div>
            {% endif %}

            <form method="POST" action="/auth/register">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">Usuario *</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña *</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    <div class="form-text">Mínimo 6 caracteres</div>
                </div>
                
                <div class="mb-3">
                    <label for="role" class="form-label">Rol *</label>
                    <select class="form-select" id="role" name="role" required onchange="toggleCuitField()">
                        <option value="cliente">Cliente</option>
                        <option value="vendedor">Vendedor</option>
                        <option value="contador">Contador</option>
                        <option value="auditor">Auditor</option>
                        <option value="admin">Administrador</option>
                    </select>
                    <div class="role-info">
                        <div id="role-description">
                            <strong>Cliente:</strong> Puede ver solo sus propias facturas
                        </div>
                    </div>
                </div>
                
                <div class="mb-3" id="cuit-field">
                    <label for="cuit_asociado" class="form-label">CUIT Asociado</label>
                    <input type="text" class="form-control" id="cuit_asociado" name="cuit_asociado" 
                           placeholder="XX-XXXXXXXX-X" maxlength="13">
                    <div class="form-text">Para clientes: CUIT para filtrar sus facturas</div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">
                    Crear Cuenta
                </button>
            </form>

            <div class="login-link">
                <p class="text-muted">¿Ya tienes cuenta? <a href="/auth/login" class="text-decoration-none">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleCuitField() {
            const role = document.getElementById('role').value;
            const cuitField = document.getElementById('cuit-field');
            const cuitInput = document.getElementById('cuit_asociado');
            const roleDescription = document.getElementById('role-description');
            
            const descriptions = {
                'cliente': '<strong>Cliente:</strong> Puede ver solo sus propias facturas',
                'vendedor': '<strong>Vendedor:</strong> Puede crear y ver facturas',
                'contador': '<strong>Contador:</strong> Puede crear, editar facturas y ver reportes',
                'auditor': '<strong>Auditor:</strong> Solo lectura de facturas y reportes',
                'admin': '<strong>Administrador:</strong> Acceso completo al sistema'
            };
            
            roleDescription.innerHTML = descriptions[role];
            
            if (role === 'cliente') {
                cuitField.style.display = 'block';
                cuitInput.required = true;
            } else {
                cuitField.style.display = 'none';
                cuitInput.required = false;
                cuitInput.value = '';
            }
        }
        
        // Formatear CUIT mientras se escribe
        document.getElementById('cuit_asociado').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '-' + value.substring(2);
            }
            if (value.length >= 11) {
                value = value.substring(0, 11) + '-' + value.substring(11, 12);
            }
            e.target.value = value;
        });
        
        // Inicializar estado del campo CUIT
        toggleCuitField();
    </script>
</body>
</html>
